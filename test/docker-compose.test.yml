services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - OPENROUTER_API_KEY=mock-key
      - MASSIVE_API_KEY=
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    working_dir: /tests
    volumes:
      - .:/tests
    environment:
      - BASE_URL=http://app.localhost:8000
      - CI=true
    command: bash -c "npm ci && npx playwright test"
    depends_on:
      app:
        condition: service_healthy
